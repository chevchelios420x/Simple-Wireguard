# Managed by Simple-WireGuard install.sh – changes will be overwritten.
# Own vhost on a dedicated port; existing nginx sites are not touched.
limit_req_zone $binary_remote_addr zone=swg_auth:10m rate=10r/m;

server {
    listen __GUI_PORT__ ssl__LISTEN_HTTP2__;
    listen [::]:__GUI_PORT__ ssl__LISTEN_HTTP2__;
__HTTP2_ON__
    server_name _;
    # plain HTTP on the TLS port -> redirect to https
    error_page 497 =301 https://$host:$server_port$request_uri;

    ssl_certificate     /etc/simple-wireguard/tls/cert.pem;
    ssl_certificate_key /etc/simple-wireguard/tls/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:swg_ssl:10m;
    ssl_session_tickets off;

    server_tokens off;
    client_max_body_size 5m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;

    access_log /var/log/simple-wireguard/nginx-access.log;
    error_log  /var/log/simple-wireguard/nginx-error.log warn;

    location /api/auth/ {
        limit_req zone=swg_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:__APP_PORT__;
        include /etc/simple-wireguard/nginx-proxy.inc;
    }
    location / {
        proxy_pass http://127.0.0.1:__APP_PORT__;
        include /etc/simple-wireguard/nginx-proxy.inc;
    }
}
